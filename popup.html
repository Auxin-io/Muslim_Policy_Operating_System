<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Muslim Policy OS</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    width: 460px;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f1115;
    color: #eaeaea;
  }
  header {
    padding: 12px 16px 8px;
    border-bottom: 1px solid #22252c;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  header h1 { font-size: 13.5px; margin: 0 0 2px; letter-spacing: 0.02em; }
  header p { margin: 0; font-size: 10.5px; color: #9aa0aa; line-height: 1.4; }
  .toggle-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-top: 1px; }
  .toggle-label { font-size: 9.5px; color: #8b93a3; }
  .switch { position: relative; width: 32px; height: 18px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #2a2e37; border-radius: 20px; transition: 0.15s;
  }
  .slider:before {
    content: ""; position: absolute; height: 14px; width: 14px; left: 2px; bottom: 2px;
    background: white; border-radius: 50%; transition: 0.15s;
  }
  input:checked + .slider { background: #3a7bfd; }
  input:checked + .slider:before { transform: translateX(14px); }

  main { padding: 12px 16px 14px; max-height: 500px; overflow-y: auto; }

  .state-box {
    text-align: center;
    padding: 22px 10px;
    color: #8b93a3;
    font-size: 12px;
    line-height: 1.5;
  }
  .state-box .spinner {
    width: 22px; height: 22px; margin: 0 auto 10px;
    border: 3px solid #2a2e37; border-top-color: #3a7bfd; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- inline map --- */
  .map-wrap {
    background: radial-gradient(ellipse at top, #1c2130 0%, #0b0d13 65%);
    border: 1px solid #22252c;
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 10px;
    position: relative;
  }
  #usaSvg { width: 100%; height: auto; max-height: 150px; display: block; }
  .state-path { stroke: #0b0d13; stroke-width: 1; fill: #232734; transition: fill 0.2s ease; }
  .state-path.direct { fill: #d7263d; }
  .state-path.precedent { fill: #6c7280; }
  .map-legend {
    position: absolute; bottom: 6px; right: 8px;
    font-size: 8.5px; color: #9aa0aa;
    display: flex; align-items: center; gap: 5px;
    background: rgba(15,17,23,0.85); padding: 3px 6px; border-radius: 6px;
  }
  .map-chip { width: 7px; height: 7px; border-radius: 2px; display: inline-block; margin-left: 5px; }
  .map-chip:first-child { margin-left: 0; }
  .map-chip.direct { background: #d7263d; }
  .map-chip.precedent { background: #6c7280; }

  /* --- bill switcher pills --- */
  .bill-pills { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px; }
  .bill-pill {
    flex-shrink: 0; padding: 5px 10px; border-radius: 14px;
    background: #171a20; border: 1px solid #262b36; color: #9aa0aa;
    font-size: 10.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .bill-pill.active { background: #1a2438; border-color: #3a7bfd; color: #7fa8ff; }

  .kicker {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .kicker.high { background: #3a1a1a; color: #ff8a8a; }
  .kicker.medium { background: #3a2f14; color: #ffcf7f; }
  .kicker.low { background: #14301c; color: #7fe0a0; }
  .kicker.unclear { background: #1e222c; color: #8b93a3; }

  .bill-title { font-size: 14px; font-weight: 700; margin: 0 0 2px; line-height: 1.3; }
  .bill-sub { font-size: 11px; color: #9aa0aa; margin-bottom: 10px; }

  .section { margin-top: 10px; }
  .section-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    color: #7a8090; margin-bottom: 4px; font-weight: 700;
  }
  .section-body { font-size: 12px; line-height: 1.5; color: #d7dae0; }
  .section-box { background: #171a20; border: 1px solid #262b36; border-radius: 8px; padding: 10px 11px; }

  ul.action-list, ul.deadline-list { margin: 4px 0 0; padding-left: 18px; }
  ul.action-list li, ul.deadline-list li { font-size: 12px; line-height: 1.45; margin-bottom: 4px; }
  .deadline-date { font-weight: 700; color: #ffcf7f; }
  .empty-note { color: #6b7280; font-style: italic; font-size: 11.5px; }

  .source-quote {
    margin: 0; padding: 8px 10px;
    background: #171a20; border: 1px solid #262b36; border-left: 3px solid #3a7bfd;
    border-radius: 6px; font-size: 11.5px; line-height: 1.5; color: #c7cbd4;
    font-style: italic;
  }

  .btn-row { display: flex; gap: 8px; margin-top: 14px; }
  button {
    border: none; border-radius: 8px; padding: 9px 8px;
    font-size: 12px; font-weight: 600; cursor: pointer; flex: 1;
  }
  .btn-primary { background: #3a7bfd; color: white; }
  .btn-secondary { background: #1f232b; color: #eaeaea; border: 1px solid #2a2e37; }

  details { margin-top: 14px; border-top: 1px solid #22252c; padding-top: 10px; }
  summary {
    font-size: 11.5px; color: #9aa0aa; cursor: pointer; font-weight: 600;
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary:before { content: "▸ "; }
  details[open] summary:before { content: "▾ "; }

  textarea {
    width: 100%; min-height: 90px; resize: vertical; margin-top: 8px;
    background: #171a20; border: 1px solid #2a2e37; border-radius: 8px;
    color: #eaeaea; padding: 9px; font-size: 12px; line-height: 1.4;
  }
  #manualStatus { margin-top: 8px; font-size: 11px; color: #9aa0aa; min-height: 14px; }
  #manualStatus.error { color: #ff8a8a; }

  footer {
    padding: 9px 16px 12px;
    border-top: 1px solid #22252c;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  footer a { color: #7fa8ff; font-size: 11px; text-decoration: none; }
  .badge-note { font-size: 9.5px; color: #6b7280; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>MUSLIM POLICY OS</h1>
      <p id="headerSub">Auto-scanning pages you visit for policy impact.</p>
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label">Auto-scan</span>
      <label class="switch">
        <input type="checkbox" id="autoScanToggle" checked />
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <main id="mainContent">
    <div class="state-box">
      <div class="spinner"></div>
      Loading…
    </div>
  </main>

  <details id="manualDetails">
    <summary>Analyze different content (paste text or a link)</summary>
    <textarea id="articleText" placeholder="Paste article text, a bill summary, or a URL..."></textarea>
    <div class="btn-row">
      <button id="analyzePasted" class="btn-primary">Analyze Pasted Text</button>
    </div>
    <div id="manualStatus"></div>
  </details>

  <footer>
    <span class="badge-note">! on the icon = a bill was detected</span>
    <a href="options.html" target="_blank">Settings</a>
  </footer>

  <script src="usa-map-data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
